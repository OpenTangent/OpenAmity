[pytest]
testpaths = tests
pythonpath = src
addopts = -ra --strict-markers
markers =
    core: Core backend system logic, state management, file utilities, and data structures
    tools: Agent tool implementations and cerebrum execution
    workers: Cognitive worker implementations (Gemini, Claude, ChatGPT, DeepSeek, OpenRouter, Subagent)
    gui: PySide6 graphical user interface, widgets, and view models
    integration: Tests interacting with external processes or services (Camoufox, Node daemon, Webhooks)
    slow: Heavy tests taking significant time to execute
